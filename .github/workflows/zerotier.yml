name: ZeroTier

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - stable
      - stable-zerotier

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test ZeroTier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.25.10
      - name: Build with ZeroTier stub
        run: go build -ldflags="$(cat release/LDFLAGS)" -tags with_zerotier ./...
      - name: Test ZeroTier
        run: go test -tags with_zerotier,with_gvisor -count=1 ./protocol/zerotier/...
      - name: Race test ZeroTier
        run: go test -tags with_zerotier,with_gvisor -race -count=1 ./protocol/zerotier/...
      - name: Vet ZeroTier
        run: go vet -tags with_zerotier,with_gvisor ./protocol/zerotier/...
      - name: Build delivery tags
        run: go build -ldflags="$(cat release/LDFLAGS)" -tags with_gvisor,with_quic,with_clash_api,with_zerotier ./...
